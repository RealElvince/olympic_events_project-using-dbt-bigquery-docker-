services:
 airflow:
    container_name: athletes_airflow
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AIRFLOW_LOAD_EXAMPLES: "n"
      AIRFLOW_CORE_EXECUTOR: "SequentialExecutor"
      AIRFLOW_CONN_GCS_DEFAULT: >-
        google-cloud-platform://?key_path=/opt/airflow/gcp/service_account.json&project=data-engineering-458813
    env_file:
      - .env

    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./gcp:/opt/airflow/gcp
      - ./buckets:/opt/airflow/buckets
      - ./bigquery_dataset:/opt/airflow/bigquery_dataset
      - ./dbt:/opt/airflow/dbt
      - ./.dbt:/root/.dbt
      

    ports:
      - "8080:8080"
    networks:
      - airflow_network 
    command: >
      bash -c "airflow standalone"
networks:
  airflow_network:
    driver: bridge